name: CI

on:
  push:
    branches: [main]
  pull_request: {}

# Least privilege. Without this, GITHUB_TOKEN inherits the repository default,
# which is read-write on contents unless the org changed it — and this job runs
# dependency install scripts plus workspace test scripts.
permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags. A tag is a mutable ref: whoever
      # controls the action's repository can repoint v4 at different code,
      # which would then run with this repository checked out. The trailing
      # comment is what Dependabot reads to keep the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # Matches vercel.json's installCommand. Frozen, so what is tested here is
      # what gets deployed: with --no-frozen-lockfile every install re-resolved
      # the floating ^/~ ranges against the live registry, which meant a new
      # (or compromised) version could reach production without pnpm-lock.yaml
      # changing or anyone reviewing it.
      - run: pnpm install --frozen-lockfile

      # Informational only, not gating: the repo has ~70 pre-existing type
      # errors (mostly Express's req.params typed as string | string[]) that
      # predate this workflow and aren't part of this change. Surfacing the
      # trend here without blocking merges until that backlog is triaged.
      - run: pnpm run typecheck
        continue-on-error: true

      - run: pnpm run test

      # Fails the build on a known-vulnerable production dependency. There was
      # no dependency gate at all before this, so an advisory could sit in the
      # tree indefinitely without anyone noticing. --prod keeps build/dev-only
      # toolchain noise (Expo, vitest, orval) from blocking merges.
      - run: pnpm audit --audit-level high --prod

      # The two outages this repo has actually had (Sentry/@opentelemetry,
      # twice) were both MODULE_NOT_FOUND at Vercel cold-start on a bundle
      # that had built and typechecked cleanly — esbuild leaves an externalised
      # package as a bare import, and Node only fails to resolve it once the
      # function actually runs. Building here and importing the real output
      # moves that failure from "production, after deploy" to "this PR".
      - run: pnpm --filter @workspace/api-server run build

      - name: Verify the built API bundle loads
        run: |
          DATABASE_URL="postgresql://u:p@localhost:5432/none" node -e "
            import('./artifacts/api-server/dist/app.mjs')
              .then((m) => { console.log('Bundle loaded OK:', typeof m.default); process.exit(0); })
              .catch((e) => { console.error('Bundle failed to load:', e.message); process.exit(1); });
          "
