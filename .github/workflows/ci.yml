name: CI

on:
  push:
    branches: [main]
  pull_request: {}

# Least privilege. Without this, GITHUB_TOKEN inherits the repository default,
# which is read-write on contents unless the org changed it — and this job runs
# dependency install scripts plus workspace test scripts.
permissions:
  contents: read

jobs:
  driver-app-v2:
    name: Driver Android client quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: artifacts/driver-app-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Typecheck driver client
        run: pnpm run typecheck

      - name: Run driver client unit tests
        run: pnpm test

      - name: Verify Android export and resolved native configuration
        env:
          EXPO_PUBLIC_API_BASE_URL: https://www.royalmidnight.com/api
        run: |
          pnpm exec expo export --platform android --no-bytecode --no-minify --output-dir dist-android-ci
          pnpm exec expo config --json > dist-android-ci/expo-config.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('dist-android-ci/expo-config.json','utf8'));const a=c.android?.buildArchs ?? c._internal?.pluginHistory?.find?.(()=>false);if(c.android?.package !== 'com.royalmidnight.driver') throw new Error('Unexpected Android package');if(c.extra?.apiBaseUrl !== 'https://www.royalmidnight.com/api') throw new Error('Unexpected API base URL');if(!JSON.stringify(c).includes('x86_64')) throw new Error('x86_64 ABI is not present in resolved config');console.log({package:c.android.package,api:c.extra.apiBaseUrl,buildArchs:c.android.buildArchs ?? 'declared by plugin'});"

  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags. A tag is a mutable ref: whoever
      # controls the action's repository can repoint v4 at different code,
      # which would then run with this repository checked out. The trailing
      # comment is what Dependabot reads to keep the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # Matches vercel.json's installCommand. Frozen, so what is tested here is
      # what gets deployed: with --no-frozen-lockfile every install re-resolved
      # the floating ^/~ ranges against the live registry, which meant a new
      # (or compromised) version could reach production without pnpm-lock.yaml
      # changing or anyone reviewing it.
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm --filter @workspace/royal-midnight run build

      # Fails the build on a known-vulnerable production dependency. There was
      # no dependency gate at all before this, so an advisory could sit in the
      # tree indefinitely without anyone noticing. --prod keeps build/dev-only
      # toolchain noise (Expo, vitest, orval) from blocking merges.
      - run: pnpm audit --audit-level high --prod

      # The two outages this repo has actually had (Sentry/@opentelemetry,
      # twice) were both MODULE_NOT_FOUND at Vercel cold-start on a bundle
      # that had built and typechecked cleanly — esbuild leaves an externalised
      # package as a bare import, and Node only fails to resolve it once the
      # function actually runs. Building here and importing the real output
      # moves that failure from "production, after deploy" to "this PR".
      - run: pnpm --filter @workspace/api-server run build

      - name: Verify the built API bundle loads
        run: |
          DATABASE_URL="postgresql://u:p@localhost:5432/none" node -e "
            import('./artifacts/api-server/dist/app.mjs')
              .then((m) => { console.log('Bundle loaded OK:', typeof m.default); process.exit(0); })
              .catch((e) => { console.error('Bundle failed to load:', e.message); process.exit(1); });
          "
