name: Reliable notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliable-notifications
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process reservation jobs and queued email
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is missing. Notifications cannot be delivered."
            exit 1
          fi
          for job in booking-jobs mail-outbox; do
            curl --fail-with-body --silent --show-error --max-time 45 --retry 2 --retry-delay 2 \
              -X POST "https://www.royalmidnight.com/api/cron/$job" \
              -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Length: 0'
          done
