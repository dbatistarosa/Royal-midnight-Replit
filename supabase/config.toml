# Supabase project config, committed so Edge Function settings are schema-as-code
# instead of dashboard state nobody can review (CN-008).

project_id = "royal-midnight"

[functions.check-reservation-status]
# Defence in depth only. verify_jwt rejects callers with no JWT at all, but it
# ACCEPTS the project's anon key, which is public by design — so it is not an
# authorization control on its own. The real gate is the FUNCTION_INVOKE_SECRET
# check at the top of the handler.
verify_jwt = true
