auditConfig:
  # One accepted exception, so `pnpm audit --audit-level high --prod` can gate
  # CI honestly instead of being permanently red. image-size sits under Metro,
  # inside the Expo driver-app: it reads image dimensions on the machine running
  # the build and is not part of the APK, so exploiting it means feeding a
  # malicious image into our own build. The fix is a 1.x -> 2.x major inside
  # Metro's dependency tree, which we are not forcing under an unrelated app.
  # Revisit at the next APK rebuild with `npx expo install --check`.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  bcrypt: true
  core-js: true
  esbuild: true

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.5
  vitest: ^4.1.9
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - bcrypt
  - core-js
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # vitest pins its own vite, which kept 7.3.2 alive after the catalog moved to
  # 7.3.5. Both advisories (GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3) cover
  # <=7.3.4. A range, not an exact pin, so this does not block future patches
  # the way the exact esbuild pin does.
  vite: '>=7.3.5'
  # Reachable-in-production advisories that no direct bump clears on its own.
  # dompurify arrives in the browser bundle via jspdf; nanoid via @uppy/aws-s3
  # in lib/object-storage-web; ip-address under express-rate-limit, which parses
  # a partly client-influenced X-Forwarded-For because app.ts trusts one proxy
  # hop; qs and body-parser under express.
  dompurify: '>=3.4.13'
  nanoid: '>=5.1.16'
  qs: '>=6.15.2'
  ip-address: '>=10.3.1'
  body-parser: '>=2.3.0'
  fast-xml-parser: '>=5.7.0'
  # uuid: GHSA-w5hq-g745-h8pq (missing buffer bounds check), arrives via
  # svix under resend in api-server's production dependencies.
  uuid: '>=11.1.1'
  # yaml: GHSA-48c2-rrv3-qjmp (stack overflow DoS), arrives via vite/vitest
  # and the Expo/Metro build toolchain.
  yaml: '>=2.8.3'
  # Expo/Metro build toolchain. These never reach the APK — they run on the
  # machine doing the build — but they are `dependencies` of driver-app, so
  # `pnpm audit --prod` counts them and the CI gate would never go green.
  # All four are meant to be same-major patches, not upgrades — js-yaml's own
  # floor was open-ended (`>=4.3.1`) and silently resolved to 5.x, a breaking
  # major that orval's codegen (import jsYaml from "js-yaml", relying on the
  # CJS default-export interop v4 provided) doesn't support. Bounded below to
  # actually mean what the comment says.
  brace-expansion: '>=5.0.9'
  js-yaml: '>=4.3.1 <5'
  postcss: '>=8.5.18'
  shell-quote: '>=1.8.5'
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm': '-'
